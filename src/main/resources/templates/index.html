<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>

    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --panel: rgba(15, 23, 42, 0.78);
            --panel-light: rgba(148, 163, 184, 0.12);
            --primary: #8b5cf6;
            --accent: #2dd4bf;
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --line: rgba(148, 163, 184, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top,
                    #1e293b 0%,
                    #0f172a 38%,
                    #020817 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: min(100%, 980px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 48px 42px;
            box-shadow: 0 25px 70px rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(18px);
        }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.14);
            color: #bbf7d0;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 14px;
            border: 1px solid rgba(34, 197, 94, .3);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2.3rem, 5vw, 4rem);
            line-height: 1.1;
        }

        p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
            max-width: 620px;
        }

        .actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 26px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            transition: all .3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: .9;
        }

        .btn.secondary {
            background: rgba(45, 212, 191, .12);
            border: 1px solid rgba(45, 212, 191, .35);
            color: var(--text);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 34px;
        }

        .stat {
            background: var(--panel-light);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
        }

        .stat small {
            color: var(--muted);
        }

        .stat strong {
            display: block;
            font-size: 1.7rem;
            margin-top: 10px;
        }

        @media (max-width:768px) {

            .container {
                padding: 30px 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="badge">Smart Campus</div>

    <h1>Student Management Portal</h1>

    <p th:text="${message != null ? message : 'Welcome to the Student Management Portal'}">
        Welcome to the Student Management Portal
    </p>

    <div class="actions">

        <a class="btn" th:href="@{/students}">
            Go to Students
        </a>

        <a class="btn secondary" th:href="@{/login}">
            Login
        </a>

    </div>

    <div class="stats">

        <div class="stat">
            <small>Students</small>
            <strong>120+</strong>
        </div>

        <div class="stat">
            <small>Courses</small>
            <strong>18</strong>
        </div>

        <div class="stat">
            <small>Success Rate</small>
            <strong>94%</strong>
        </div>

    </div>

</div>

</body>

</html>
