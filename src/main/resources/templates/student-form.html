<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add / Edit Student</title>

    <style>
        :root {
            --bg: #071321;
            --panel: rgba(15, 23, 42, 0.82);
            --line: rgba(148, 163, 184, 0.2);
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --primary: #8b5cf6;
            --danger: #fca5a5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #020817, #0f172a 50%, #111827);
            color: var(--text);
        }

        .container {
            width: min(100%, 650px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 24px 60px rgba(2, 8, 23, .7);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            font-size: 2.2rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            color: var(--muted);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, .25);
            background: rgba(15, 23, 42, .8);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: .3s;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 10px rgba(139, 92, 246, .3);
        }

        .error {
            color: var(--danger);
            font-size: .85rem;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: .95;
        }

        .cancel {
            display: inline-flex;
            align-items: center;
            padding: 14px 22px;
            text-decoration: none;
            color: white;
            border-radius: 12px;
            background: rgba(148, 163, 184, .15);
            border: 1px solid rgba(148, 163, 184, .25);
            transition: .3s;
        }

        .cancel:hover {
            background: rgba(148, 163, 184, .25);
        }

        @media (max-width:600px) {

            .container {
                padding: 25px;
            }

            .actions {
                flex-direction: column;
            }

            button,
            .cancel {
                width: 100%;
                justify-content: center;
                text-align: center;
            }

        }
    </style>

</head>

<body>

<div class="container">

    <h1>Add / Edit Student</h1>

    <form th:action="@{/students}"
        th:object="${student}"
        method="post"
        enctype="multipart/form-data">

        <!-- Student ID - important for Edit -->
        <input type="hidden" th:field="*{id}">

        <!-- NAME -->
        <div class="field">

            <label for="name">Name</label>

            <input
                id="name"
                type="text"
                th:field="*{name}"
                placeholder="Enter Student Name"
                required>

            <div class="error"
                th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}">
            </div>

        </div>

    <!-- COURSE -->
        <div class="field">

            <label for="course">Course</label>

            <input
                id="course"
                type="text"
                th:field="*{course}"
                placeholder="Enter Course"
                required>

            <div class="error"
                 th:if="${#fields.hasErrors('course')}"
                 th:errors="*{course}">
            </div>

        </div>

    <!-- MARKS -->
        <div class="field">

            <label for="marks">Marks</label>

            <input
                id="marks"
                type="number"
                th:field="*{marks}"
                min="0"
                max="100"
                placeholder="Enter Marks"
                required>

            <div class="error"
                 th:if="${#fields.hasErrors('marks')}"
                 th:errors="*{marks}">
            </div>

        </div>

    <!-- PHOTO -->
        <div class="field">

            <label for="image">Student Photo</label>

            <input
                id="image"
                type="file"
                name="image"
                accept="image/*">

        </div>

    <!-- BUTTONS -->
        <div class="actions">

            <button type="submit">
                Save Student
            </button>

            <a class="cancel"
              th:href="@{/students}">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
