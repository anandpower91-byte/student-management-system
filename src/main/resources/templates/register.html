<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        :root {
            --bg-1: #071120;
            --bg-2: #111827;
            --panel: rgba(15, 23, 42, 0.78);
            --line: rgba(148, 163, 184, 0.22);
            --text: #e5e7eb;
            --muted: #cbd5e1;
            --primary: #22c55e;
            --secondary: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            padding: 24px;
        }

        .box {
            width: min(100%, 420px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 22px 45px rgba(8, 17, 33, 0.7);
            backdrop-filter: blur(12px);
        }

        h2 {
            margin: 0 0 20px;
            text-align: center;
            font-size: 2rem;
        }

        .error,
        .success {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #fecaca;
        }

        .success {
            background: rgba(134, 239, 172, 0.15);
            border: 1px solid rgba(134, 239, 172, 0.3);
            color: #d1fae5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.8);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: .3s;
        }

        input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: .95;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: var(--muted);
        }

        a {
            color: #bae6fd;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width:480px) {
            .box {
                padding: 24px 20px;
            }

            h2 {
                font-size: 1.8rem;
            }
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Create Account</h2>

    <div class="error"
         th:if="${error != null}"
         th:text="${error}">
    </div>

    <div class="success"
         th:if="${success != null}"
         th:text="${success}">
    </div>

    <form th:action="@{/register}" method="post">

        <input
                type="text"
                name="username"
                placeholder="Username"
                required>

        <input
                type="password"
                name="password"
                placeholder="Password"
                required>

        <button type="submit">
            Register
        </button>

    </form>

    <div class="footer">
        Already have an account?
        <a th:href="@{/login}">
            Login Here
        </a>
    </div>

</div>

</body>

</html>
